<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" role="img" aria-labelledby="title desc">
  <title id="title">HOMECYCLE wordmark</title>
  <desc id="desc">Two-line stacked HOMECYCLE wordmark with navy serif italic letters and a vintage gold divider.</desc>
  <rect width="480" height="120" fill="none"/>
  <g fill="#1A3D5C" font-family="'Cormorant Garamond', 'Noto Serif JP', Georgia, serif" font-style="italic" font-weight="500" text-anchor="middle" letter-spacing="15">
    <text x="240" y="44" font-size="44">HOME</text>
    <text x="240" y="99" font-size="44">CYCLE</text>
  </g>
  <line x1="139" y1="61" x2="341" y2="61" stroke="#C9A961" stroke-width="1.25" stroke-linecap="round"/>
</svg>
